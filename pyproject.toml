[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clamshack"
version = "0.1.3"
description = "Tool for running CLAMS applications and managing resulting MMIF files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mmif-storage==0.2.1",
    "rich>=15.0.0"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
shack = "shack:start_shack"
create-shack-example = "shack:create_shack_example"

[project.urls]
homepage = "https://clams.ai"
source = "https://github.com/clamsproject/clamshack"

[tool.setuptools.package-data]
shack = ["data/*.txt", "data/*.mmif"]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["src"]

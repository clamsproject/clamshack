[project]
name = "clamshack-mv"
version = "0.1.0.rc1"
description = "ClamShack tool for running CLAMS applications and managing resulting MMIF files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # TODO: mmif-storage dependency is still done manually
    "rich>=15.0.0"
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["src"]
